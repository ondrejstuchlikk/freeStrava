<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>freeStrava</title>
  <meta name="description" content="Detailed analysis of your Strava activities: splits, zones, best efforts, fitness and form. Computed in your browser.">
  <meta name="theme-color" content="#fc4c02">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fc4c02'/%3E%3Cpath d='M7 22l6-8 5 5 7-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
          integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
          crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"
          crossorigin="anonymous" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo">free<span>Strava</span></a>
    <nav class="nav">
      <a href="#/" data-view="home" data-i18n="nav.activities">Aktivity</a>
      <a href="#/fitness" data-view="fitness" data-i18n="nav.fitness">Kondice</a>
      <a href="#/trends" data-view="trends" data-i18n="nav.trends">Trendy</a>
    </nav>
    <div class="top-tools">
      <div class="lang-switch" role="group" data-i18n-aria="nav.language">
        <button type="button" data-lang="cs" aria-label="Čeština" title="Čeština">
          <svg viewBox="0 0 6 4" aria-hidden="true"><rect width="6" height="2" fill="#fff"/><rect y="2" width="6" height="2" fill="#d7141a"/><path d="M0 0l3 2-3 2z" fill="#11457e"/></svg>
        </button>
        <button type="button" data-lang="en" aria-label="English" title="English">
          <svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="uk-s"><path d="M0 0v30h60V0z"/></clipPath><clipPath id="uk-t"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#uk-s)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#uk-t)" stroke="#c8102e" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/></g></svg>
        </button>
      </div>
      <button id="open-settings" type="button" class="icon-btn" data-i18n-aria="nav.settings" title="Nastavení">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4L10.6 6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </div>
  </header>

  <main class="content">
    <!-- ================= Home ================= -->
    <section id="view-home" class="view" hidden>
      <div class="card add-card">
        <h1 data-i18n="home.title"></h1>
        <p class="muted" data-i18n="home.intro"></p>

        <ol class="steps">
          <li>
            <h2 data-i18n="step1.title"></h2>

            <div class="only-desktop">
              <a class="btn primary" href="https://www.strava.com/athlete/training" target="_blank" rel="noopener" data-strava-open data-i18n="desk.open"></a>
              <ol class="substeps">
                <li data-i18n="desk.s1"></li>
                <li data-i18n-html="desk.s2"></li>
              </ol>
              <p class="muted small" data-i18n="desk.nomenu"></p>
            </div>

            <div class="only-phone">
              <a class="btn primary" href="https://www.strava.com/login" target="_blank" rel="noopener" data-strava-open data-i18n="phone.open"></a>
              <ol class="substeps">
                <li data-i18n="phone.s1"></li>
                <li data-i18n-html="phone.s2"></li>
                <li data-i18n-html="phone.s3"></li>
              </ol>
            </div>

            <div class="paste-row">
              <button id="paste-link" type="button" class="btn" data-i18n="paste.btn"></button>
              <input id="strava-link" type="url" inputmode="url" autocomplete="off" data-i18n-placeholder="paste.placeholder" data-i18n-aria="paste.label">
            </div>
            <p id="link-hint" class="hint" aria-live="polite"></p>

            <div id="link-ready" class="link-ready" hidden>
              <div class="only-desktop">
                <a id="strava-download" class="btn primary" target="_blank" rel="noopener" data-i18n="desk.download"></a>
              </div>
              <div class="only-phone">
                <button id="copy-download" type="button" class="btn primary" data-i18n="phone.copy"></button>
                <p class="muted small" data-i18n="phone.copyHelp"></p>
                <input id="download-url" type="text" readonly data-i18n-aria="download.label">
              </div>
            </div>
            <p class="small"><button id="switch-device" type="button" class="link-btn"></button></p>
          </li>
          <li id="step-file">
            <h2 data-i18n="step2.title"></h2>
            <label id="dropzone" class="dropzone">
              <input id="file-input" type="file" accept=".fit,.gpx,.tcx,.gz,application/octet-stream,application/gpx+xml" multiple>
              <span id="choose-file" class="btn" data-i18n="step2.choose"></span>
              <span class="muted small only-desktop" data-i18n="step2.deskHint"></span>
              <span class="muted small only-phone" data-i18n-html="step2.phoneHint"></span>
            </label>
            <p id="add-status" class="status" role="status" hidden></p>
          </li>
        </ol>
        <p class="muted small" data-i18n-html="home.demo"></p>
      </div>

      <h2 id="history-head" class="section-title" data-i18n="history.title" hidden></h2>
      <p id="history-empty" class="muted center small" data-i18n="history.empty" hidden></p>
      <ul id="activity-list" class="act-list"></ul>
    </section>

    <!-- ================= Activity ================= -->
    <section id="view-activity" class="view" hidden>
      <a href="#/" class="back" data-i18n="act.back"></a>
      <div id="demo-banner" class="banner" data-i18n-html="act.demoBanner" hidden></div>
      <div class="act-head">
        <div>
          <h1 id="act-title"></h1>
          <p id="act-sub" class="muted"></p>
        </div>
        <div class="act-actions">
          <a id="act-strava" class="btn-ghost" target="_blank" rel="noopener" data-i18n="act.viewStrava" hidden></a>
          <button id="act-delete" type="button" class="btn-ghost danger" data-i18n="act.delete"></button>
        </div>
      </div>
      <p id="act-loading" class="muted" data-i18n="act.loading" hidden></p>

      <div id="act-body" hidden>
        <div id="act-tiles" class="tiles"></div>

        <div class="card">
          <h2 data-i18n="act.highlights"></h2>
          <ul id="act-insights" class="insights"></ul>
        </div>

        <div id="map-card" class="card map-card">
          <div class="card-head">
            <h2 data-i18n="act.route"></h2>
            <div id="map-mode" class="seg" role="group" data-i18n-aria="map.colorBy">
              <button type="button" data-mode="speed" aria-pressed="true"></button>
              <button type="button" data-mode="hr" aria-pressed="false" data-i18n="map.hr"></button>
              <button type="button" data-mode="grade" aria-pressed="false" data-i18n="map.grade"></button>
            </div>
          </div>
          <div id="map" class="map"></div>
          <div id="map-legend" class="map-legend"></div>
        </div>

        <div class="card">
          <div class="card-head sticky-head">
            <h2 data-i18n="act.analysis"></h2>
            <span id="readout-x" class="muted small"></span>
          </div>
          <div id="act-charts"></div>
        </div>

        <div id="splits-card" class="card">
          <div class="card-head">
            <h2 data-i18n="act.splits"></h2>
            <button id="export-splits" type="button" class="btn-ghost small" data-i18n="act.downloadCsv"></button>
          </div>
          <div class="table-wrap">
            <table class="splits"><thead id="splits-head"></thead><tbody id="splits-rows"></tbody></table>
          </div>
          <p class="muted small" data-i18n="act.gapNote"></p>
        </div>

        <div id="zones-card" class="card">
          <h2 data-i18n="act.zones"></h2>
          <div id="act-zones" class="zone-grid"></div>
        </div>

        <div id="efforts-card" class="card">
          <h2 data-i18n="act.bestEfforts"></h2>
          <div class="table-wrap">
            <table class="efforts"><thead><tr><th data-i18n="th.distance"></th><th class="num" data-i18n="th.time"></th><th class="num" data-i18n="th.pace"></th><th></th></tr></thead><tbody id="efforts-rows"></tbody></table>
          </div>
          <p id="efforts-note" class="muted small"></p>
        </div>

        <div id="power-card" class="card">
          <h2 data-i18n="act.powerCurve"></h2>
          <div class="chart"><canvas id="chart-power-curve" role="img" data-i18n-aria="act.powerCurve"></canvas></div>
        </div>

        <div class="card">
          <h2 data-i18n="act.download"></h2>
          <div class="row">
            <button id="export-points" type="button" class="btn" data-i18n="act.allPoints"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= Fitness ================= -->
    <section id="view-fitness" class="view" hidden>
      <h1 data-i18n="fit.title"></h1>
      <p id="fitness-empty" class="muted" data-i18n="fit.empty" hidden></p>
      <div id="fitness-body">
        <p id="fitness-coverage" class="note"></p>
        <div class="tiles tiles-3">
          <div class="tile"><span class="tile-label" data-i18n="chart.fitness"></span><span id="stat-fitness" class="tile-value"></span><span id="stat-fitness-sub" class="tile-sub"></span></div>
          <div class="tile"><span class="tile-label" data-i18n="chart.fatigue"></span><span id="stat-fatigue" class="tile-value"></span><span class="tile-sub" data-i18n="fit.fatigueSub"></span></div>
          <div class="tile"><span class="tile-label" data-i18n="chart.form"></span><span id="stat-form" class="tile-value"></span><span id="stat-form-sub" class="tile-sub"></span></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="fit.chartTitle"></h2>
            <div id="fitness-range" class="seg" role="group" data-i18n-aria="fit.range">
              <button type="button" data-days="91" aria-pressed="false" data-i18n="fit.r3"></button>
              <button type="button" data-days="182" aria-pressed="true" data-i18n="fit.r6"></button>
              <button type="button" data-days="365" aria-pressed="false" data-i18n="fit.r12"></button>
              <button type="button" data-days="0" aria-pressed="false" data-i18n="fit.rAll"></button>
            </div>
          </div>
          <div class="chart tall"><canvas id="chart-fitness" role="img" data-i18n-aria="fit.chartTitle"></canvas></div>
          <h3 data-i18n-html="fit.formTitle"></h3>
          <div class="chart short"><canvas id="chart-form" role="img" data-i18n-aria="chart.form"></canvas></div>
        </div>
        <div class="card">
          <h2 data-i18n="fit.weekly"></h2>
          <div class="chart"><canvas id="chart-weekly-load" role="img" data-i18n-aria="fit.weekly"></canvas></div>
        </div>
        <details class="explain">
          <summary data-i18n="fit.how"></summary>
          <p data-i18n-html="fit.how1"></p>
          <p data-i18n-html="fit.how2"></p>
        </details>
      </div>
    </section>

    <!-- ================= Trends ================= -->
    <section id="view-trends" class="view" hidden>
      <h1 data-i18n="tr.title"></h1>
      <p id="trends-empty" class="muted" data-i18n="tr.empty" hidden></p>
      <div id="trends-body">
        <div class="filters">
          <label><span data-i18n="tr.per"></span> <select id="vol-period"><option value="week" data-i18n="tr.week"></option><option value="month" data-i18n="tr.month"></option><option value="year" data-i18n="tr.year"></option></select></label>
          <label><span data-i18n="tr.show"></span> <select id="vol-metric"><option value="distance" data-i18n="tr.distance"></option><option value="time" data-i18n="tr.time"></option><option value="elevation" data-i18n="tr.elevation"></option><option value="count" data-i18n="tr.count"></option></select></label>
          <label><span data-i18n="tr.sport"></span> <select id="vol-sport"></select></label>
        </div>
        <div class="card">
          <div class="chart tall"><canvas id="chart-volume" role="img" data-i18n-aria="tr.title"></canvas></div>
          <ul id="volume-totals" class="totals"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="powered" data-i18n="footer"></footer>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- ================= Settings ================= -->
  <dialog id="settings">
    <form id="settings-form">
      <h2 data-i18n="set.title"></h2>
      <p class="muted" data-i18n="set.intro"></p>
      <label><span data-i18n="set.maxhr"></span> <input id="set-maxhr" type="number" inputmode="numeric" min="120" max="230"></label>
      <label><span data-i18n="set.resthr"></span> <input id="set-resthr" type="number" inputmode="numeric" min="30" max="100"></label>
      <label><span data-i18n="set.formula"></span>
        <select id="set-sex"><option value="1.92" data-i18n="set.male"></option><option value="1.67" data-i18n="set.female"></option></select>
      </label>
      <label><span data-i18n="set.pace"></span> <input id="set-pace" type="text" inputmode="numeric" autocomplete="off"></label>
      <label><span data-i18n="set.ftp"></span> <input id="set-ftp" type="number" inputmode="numeric" min="50" max="600"></label>
      <div class="dialog-actions">
        <button type="button" id="settings-cancel" class="btn-ghost" data-i18n="set.cancel"></button>
        <button type="submit" class="btn primary" data-i18n="set.save"></button>
      </div>
      <hr>
      <h3 data-i18n="set.data"></h3>
      <p class="muted small" data-i18n="set.dataNote"></p>
      <div class="row">
        <button id="export-all-csv" type="button" class="btn" data-i18n="set.csv"></button>
        <button id="export-all-json" type="button" class="btn" data-i18n="set.json"></button>
      </div>
      <button id="delete-all" type="button" class="btn-ghost danger" data-i18n="set.deleteAll"></button>
    </form>
  </dialog>
</body>
</html>

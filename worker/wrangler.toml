# Optional: only needed if you deploy with the wrangler CLI instead of the
# Cloudflare dashboard editor. Secrets are NOT stored here:
#   npx wrangler secret put STRAVA_CLIENT_SECRET
name = "freestrava-auth"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
STRAVA_CLIENT_ID = "REPLACE_WITH_CLIENT_ID"
ALLOWED_ORIGINS = "https://REPLACE_WITH_GITHUB_USERNAME.github.io,http://localhost:8000"
